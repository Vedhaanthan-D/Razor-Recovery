<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-driven recovery for failed Razorpay payments. Live funnel, agent traces and strategy performance." />
    <meta name="theme-color" content="#7c3aed" />
    <title>Recovery Agent</title>
    <script>
      // Apply the saved theme before first paint so dark-mode users don't flash light.
      // Light is the default (white-first); dark is opt-in via the header toggle.
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
